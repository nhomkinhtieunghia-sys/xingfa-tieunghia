<body>
    <div id="app">
        <main>
            <div class="page-banner">
                <div class="container">
                    <h1 data-i18n="datLich.tieuDe">Đặt lịch & Tiến độ</h1>
                    <div class="breadcrumb">
                        <a href="index.html" data-i18n="menu.trangChu">Trang chủ</a> ›
                        <span data-i18n="datLich.tieuDe">Đặt lịch & Tiến độ</span>
                    </div>
                </div>
            </div>

            <section class="section">
                <div class="container dl-khung">
                    <div class="dl-tabs" role="tablist">
                        <button type="button" class="dl-tab active" data-tab="dat" role="tab" data-i18n="datLich.tabDat">Đặt lịch khảo sát</button>
                        <button type="button" class="dl-tab" data-tab="tra" role="tab" data-i18n="datLich.tabTraCuu">Tra cứu & tiến độ</button>
                    </div>

                    <!-- TAB 1: ĐẶT LỊCH -->
                    <div class="dl-panel active" id="panel-dat">
                        <div class="dl-the" id="khung-form-dat">
                            <p class="dl-mo-ta" data-i18n="datLich.gioiThieuDat">Khảo sát, đo đạc tận nơi miễn phí.</p>
                            <form id="form-dat-lich" novalidate>
                                <div class="dl-luoi">
                                    <label class="dl-o">
                                        <span data-i18n="datLich.hoTen">Họ và tên *</span>
                                        <input type="text" id="dl-ho-ten" maxlength="80" autocomplete="name" required>
                                    </label>
                                    <label class="dl-o">
                                        <span data-i18n="datLich.sdt">Số điện thoại (10 số) *</span>
                                        <input type="tel" id="dl-sdt" maxlength="10" inputmode="numeric" autocomplete="tel" required>
                                    </label>
                                    <label class="dl-o dl-o-rong">
                                        <span data-i18n="datLich.diaChi">Địa chỉ công trình *</span>
                                        <input type="text" id="dl-dia-chi" maxlength="200" autocomplete="street-address" required>
                                    </label>
                                    <label class="dl-o">
                                        <span data-i18n="datLich.dichVu">Dịch vụ quan tâm</span>
                                        <select id="dl-dich-vu"></select>
                                    </label>
                                    <label class="dl-o">
                                        <span data-i18n="datLich.ngayHen">Ngày hẹn *</span>
                                        <input type="date" id="dl-ngay" required>
                                    </label>
                                    <div class="dl-o dl-o-rong">
                                        <span data-i18n="datLich.buoi">Buổi</span>
                                        <div class="dl-buoi">
                                            <label><input type="radio" name="dl-buoi" value="sang" checked> <span data-i18n="datLich.sang">Sáng (8h – 11h)</span></label>
                                            <label><input type="radio" name="dl-buoi" value="chieu"> <span data-i18n="datLich.chieu">Chiều (13h – 17h)</span></label>
                                        </div>
                                    </div>
                                    <label class="dl-o dl-o-rong">
                                        <span data-i18n="datLich.ghiChu">Ghi chú</span>
                                        <textarea id="dl-ghi-chu" rows="3" maxlength="500"></textarea>
                                    </label>
                                </div>
                                <p class="dl-loi" id="dl-loi-dat" role="alert"></p>
                                <button type="submit" class="btn-chinh dl-nut-lon" id="nut-dat" data-i18n="datLich.nutDat">Đặt lịch khảo sát</button>
                            </form>
                        </div>

                        <!-- Hộp thành công -->
                        <div class="dl-the dl-thanh-cong" id="hop-thanh-cong" hidden>
                            <div class="dl-dau-tick">✓</div>
                            <h2 data-i18n="datLich.thanhCong">Đặt lịch thành công!</h2>
                            <p data-i18n="datLich.maLichCuaBan">Mã lịch của bạn</p>
                            <div class="dl-ma" id="ma-lich-moi">TN-0000</div>
                            <p class="dl-mo-ta" data-i18n="datLich.nhacLuuMa">Hãy lưu mã này.</p>
                            <div class="dl-hang-nut">
                                <button type="button" class="btn-phu" id="nut-sao-chep" data-i18n="datLich.saoChep">Sao chép mã</button>
                                <button type="button" class="btn-chinh" id="nut-xem-tien-do" data-i18n="datLich.xemTienDo">Xem tiến độ</button>
                                <button type="button" class="btn-phu" id="nut-dat-khac" data-i18n="datLich.datLichKhac">Đặt lịch khác</button>
                            </div>
                        </div>
                    </div>

                    <!-- TAB 2: TRA CỨU -->
                    <div class="dl-panel" id="panel-tra">
                        <div class="dl-the">
                            <p class="dl-mo-ta" data-i18n="datLich.gioiThieuTraCuu">Nhập mã lịch và số điện thoại.</p>
                            <form id="form-tra-cuu" class="dl-form-tra" novalidate>
                                <label class="dl-o">
                                    <span data-i18n="datLich.maLich">Mã lịch *</span>
                                    <input type="text" id="tc-ma" maxlength="10" placeholder="TN-4821" required>
                                </label>
                                <label class="dl-o">
                                    <span data-i18n="datLich.sdt">Số điện thoại *</span>
                                    <input type="tel" id="tc-sdt" maxlength="10" inputmode="numeric" required>
                                </label>
                                <button type="submit" class="btn-chinh" id="nut-tra-cuu" data-i18n="datLich.nutTraCuu">Tra cứu</button>
                            </form>
                            <p class="dl-loi" id="dl-loi-tra" role="alert"></p>
                        </div>
                        <div id="ket-qua-tra-cuu"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal đổi lịch -->
    <div class="dl-modal-nen" id="modal-doi" hidden>
        <div class="dl-modal" role="dialog" aria-modal="true">
            <h3 data-i18n="datLich.doiLichTieuDe">Đổi ngày / buổi hẹn</h3>
            <label class="dl-o">
                <span data-i18n="datLich.ngayMoi">Ngày hẹn mới</span>
                <input type="date" id="doi-ngay">
            </label>
            <div class="dl-o">
                <span data-i18n="datLich.buoi">Buổi</span>
                <div class="dl-buoi">
                    <label><input type="radio" name="doi-buoi" value="sang" checked> <span data-i18n="datLich.sang">Sáng</span></label>
                    <label><input type="radio" name="doi-buoi" value="chieu"> <span data-i18n="datLich.chieu">Chiều</span></label>
                </div>
            </div>
            <p class="dl-loi" id="dl-loi-doi" role="alert"></p>
            <div class="dl-hang-nut">
                <button type="button" class="btn-phu" data-dong-modal data-i18n="datLich.dong">Đóng</button>
                <button type="button" class="btn-chinh" id="nut-luu-doi" data-i18n="datLich.luu">Lưu thay đổi</button>
            </div>
        </div>
    </div>

    <!-- Modal xác nhận hủy -->
    <div class="dl-modal-nen" id="modal-huy" hidden>
        <div class="dl-modal" role="dialog" aria-modal="true">
            <h3 data-i18n="datLich.nutHuy">Hủy lịch</h3>
            <p data-i18n="datLich.xacNhanHuy">Bạn chắc chắn muốn hủy lịch khảo sát này?</p>
            <div class="dl-hang-nut">
                <button type="button" class="btn-phu" data-dong-modal data-i18n="datLich.khong">Không</button>
                <button type="button" class="btn-chinh" id="nut-xac-nhan-huy" data-i18n="datLich.coHuy">Có, hủy lịch</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/lang/vi.js"></script>
    <script src="assets/lang/en.js"></script>
    <script src="assets/lang/zh.js"></script>
    <script src="assets/js/ngon-ngu.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/hieu-ung.js"></script>
    <script src="assets/js/dat-lich.js"></script>
</body>
</html>
