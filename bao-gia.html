<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/images/logo.jpg">
    <title>Giỏ báo giá - Xingfa Tiếu Nghĩa</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Be+Vietnam+Pro:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .cart-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .cart-table th, .cart-table td { padding: 15px; text-align: left; border-bottom: 1px solid var(--mau-vien); vertical-align: middle; }
        .cart-table th { font-weight: 600; color: var(--mau-chinh); background: var(--mau-nen-nhat); }
        /* Tăng tối thiểu 160px cho cột Kích thước */
        .cart-table th:nth-child(3), .cart-table td:nth-child(3) { min-width: 160px; }
        .cart-item-img { width: 60px; height: 60px; object-fit: cover; border-radius: var(--bo-goc); vertical-align: middle; margin-right: 15px; }
        .cart-qty-input { width: 50px; text-align: center; padding: 6px; border: 1px solid var(--mau-vien); border-radius: 4px; }
        .cart-note-input { width: 100%; padding: 8px; border: 1px solid var(--mau-vien); border-radius: 4px; font-family: inherit; }
        .btn-delete { color: var(--mau-nhan); cursor: pointer; background: none; border: none; font-size: 14px; text-decoration: underline; }
        
        /* Mobile hiển thị dạng thẻ dọc */
        @media (max-width: 768px) {
            .cart-table, .cart-table tbody, .cart-table tr, .cart-table td { display: block; width: 100%; }
            .cart-table thead { display: none; }
            .cart-table tr { margin-bottom: 15px; border: 1px solid var(--mau-vien); border-radius: var(--bo-goc); overflow: hidden; }
            .cart-table td { position: relative; padding: 15px; text-align: right; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
            .cart-table td::before { content: attr(data-label); font-weight: 600; text-align: left; margin-right: 15px; color: var(--mau-chinh); }
            .cart-table td:first-child { display: block; text-align: center; background: var(--mau-nen-nhat); }
            .cart-table td:first-child::before { display: none; }
            .cart-item-img { margin: 0 auto 10px; display: block; width: 80px; height: 80px; }
            .cart-note-input { width: 100%; max-width: 60%; }
        }

        /* CSS Modal xác nhận */
        .confirm-modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 10000; opacity: 0; pointer-events: none; transition: 0.2s; }
        .confirm-modal-overlay.active { opacity: 1; pointer-events: auto; }
        .confirm-modal { background: #fff; padding: 25px; border-radius: var(--bo-goc); width: 90%; max-width: 400px; text-align: center; transform: translateY(-20px); transition: 0.2s; }
        .confirm-modal-overlay.active .confirm-modal { transform: translateY(0); }
        .confirm-modal h4 { color: var(--mau-chinh); margin-bottom: 15px; font-size: 18px; }
        .confirm-modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 20px; }
        .confirm-modal-actions button { flex: 1; }
    </style>

<body>
    <div id="app">
        <main>
            <!-- Header trang con -->
            <div class="page-banner">
                <div class="container">
                    <h1 id="page-title" data-hieu-ung="len" data-i18n="baoGia.tieuDe">Giỏ Yêu Cầu Báo Giá</h1>
                    <div class="breadcrumb" data-hieu-ung="len">
                        <a href="index.html" data-i18n="menu.trangChu">Trang chủ</a> › 
                        <span data-i18n="baoGia.tieuDe">Giỏ báo giá</span>
                    </div>
                </div>
            </div>

            <section class="section">
                <div class="container grid-2" id="cart-container" data-hieu-ung="len" style="gap: 40px; align-items: start;">
                    
                    <div id="cart-content">
                        <!-- JS sẽ render bảng giỏ hàng hoặc thông báo trống -->
                    </div>

                    <div class="value-card" id="cart-form-container">
                        <h3 style="color: var(--mau-chinh); margin-bottom: 20px; font-size: 20px;" data-i18n="baoGia.thongTinLienHe">Thông tin liên hệ</h3>
                        <form id="quote-form" onsubmit="submitQuote(event)">
                            <div style="margin-bottom: 15px;">
                                <input type="text" id="q-name" required placeholder="Họ và tên *" style="width: 100%; padding: 12px; border: 1px solid var(--mau-vien); border-radius: var(--bo-goc);" data-i18n-placeholder="baoGia.hoTen">
                            </div>
                            <div style="margin-bottom: 15px;">
                                <input type="tel" id="q-phone" required placeholder="Số điện thoại (10 số) *" style="width: 100%; padding: 12px; border: 1px solid var(--mau-vien); border-radius: var(--bo-goc);" data-i18n-placeholder="baoGia.sdt">
                            </div>
                            <div style="margin-bottom: 15px;">
                                <input type="email" id="q-email" placeholder="Email" style="width: 100%; padding: 12px; border: 1px solid var(--mau-vien); border-radius: var(--bo-goc);" data-i18n-placeholder="baoGia.email">
                            </div>
                            <div style="margin-bottom: 15px;">
                                <input type="text" id="q-address" placeholder="Địa chỉ công trình" style="width: 100%; padding: 12px; border: 1px solid var(--mau-vien); border-radius: var(--bo-goc);" data-i18n-placeholder="baoGia.diaChi">
                            </div>
                            <div style="margin-bottom: 20px;">
                                <textarea id="q-note" rows="3" placeholder="Yêu cầu thêm" style="width: 100%; padding: 12px; border: 1px solid var(--mau-vien); border-radius: var(--bo-goc); font-family: inherit;" data-i18n-placeholder="baoGia.ghiChu"></textarea>
                            </div>
                            <button type="submit" id="btn-submit-quote" class="btn btn-chinh" style="width: 100%; justify-content: center;" data-i18n="baoGia.guiYeuCau">Gửi yêu cầu báo giá</button>
                        </form>
                        <div id="quote-msg" style="margin-top: 15px; font-weight: 500; font-size: 15px; display: none;"></div>
                    </div>

                </div>
            </section>
        </main>
    </div>

    <!-- Modal Xác Nhận Xóa -->
    <div class="confirm-modal-overlay" id="confirm-modal">
        <div class="confirm-modal">
            <h4 id="confirm-msg">Bạn có chắc chắn?</h4>
            <div class="confirm-modal-actions">
                <button class="btn btn-phu" onclick="closeConfirmModal()" data-i18n="baoGia.huy">Hủy</button>
                <button class="btn-nguy-hiem" onclick="executeDelete()" data-i18n="baoGia.dongY">Đồng ý</button>
            </div>
        </div>
    </div>

    <!-- CDN Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</body>
</html>
